<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="%23d4d4d4"/>
  <path d="M28 55 L45 72 L72 32" stroke="%232b2b2b" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>'>
<script>
const t = localStorage.getItem("login_time");

if(!t || Date.now() - t > 10*60*60*1000){
  location.href = "index.html";
}
</script>
<style>

:root {
  --bg:#d4d4d4;
  --panel:#e6e6e6;
  --border:#999;
}

* {
  box-sizing: border-box;
}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);

  display:flex;
  flex-direction:column;
  min-height:100vh;
}
.topbar{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;
  border-bottom:1px solid var(--border);
  background:var(--panel);
}

.back{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid #888;
  background:#eee;
  cursor:pointer;
  font-size:14px;
}

.title{
  font-weight:600;
  font-size:14px;
}

.spacer{
  flex:1;
}
.wrap{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:20px;
}
.app{
  width:100%;
  max-width:400px;
  background:var(--panel);
  border:1px solid var(--border);
}

.header{
  padding:10px;
  border-bottom:1px solid var(--border);
  font-weight:bold;
}

.body{
  padding:10px;
}

input{
  width:100%;
  padding:6px;
  margin-bottom:10px;
  box-sizing: border-box;
}

.item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  padding:6px 0;
}

button{
  border:1px solid #888;
  background:#eee;
  cursor:pointer;
  padding:3px 6px;
}
</style>
</head>

<body>
  <!-- ===== MINI TOPBAR ===== -->
<!-- TOPBAR -->
<div class="topbar">
  <button class="back" onclick="location.href='index.html'">←</button>
  <div class="title">Todo</div>
  <div class="spacer"></div>
</div>

<!-- APP WRAPPER -->
<div class="wrap">
  <div class="app">
    <div class="header">Tasks</div>

    <div class="body">
      <input id="todoInput" placeholder="Task...">
      <div id="todoList"></div>
    </div>
  </div>
</div>

<script>
const State={
  todos:JSON.parse(localStorage.getItem("todos")||"[]")
};

const Todo={
  add(text){
    if(!text.trim()) return;

    State.todos.push({
      id:Date.now(),
      text
    });

    this.save();
    UI.render();
  },

  remove(id){
    State.todos = State.todos.filter(t=>t.id!==id);
    this.save();
    UI.render();
  },

  save(){
    localStorage.setItem("todos",JSON.stringify(State.todos));
  }
};

const UI={
  render(){
    const el=document.getElementById("todoList");
    el.innerHTML="";

    State.todos.forEach(t=>{
      const row=document.createElement("div");
      row.className="item";

      row.innerHTML = `
        <span>${t.text}</span>
        <button onclick="Todo.remove(${t.id})">Del</button>
      `;

      el.appendChild(row);
    });
  },

  init(){
    this.render();

    document.getElementById("todoInput")
      .addEventListener("keydown",e=>{
        if(e.key==="Enter"){
          Todo.add(e.target.value);
          e.target.value="";
        }
      });
  }
};

UI.init();
</script>

</body>
</html>
