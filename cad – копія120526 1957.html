<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CAD Lite</title>

<style>

:root{
  --bg:#d4d4d4;
  --panel:#e6e6e6;
  --border:#999;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  font-family:Segoe UI;
  background:var(--bg);
}

/* ================= TOOLBAR ================= */

.toolbar{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:56px;

  display:flex;
  align-items:center;
  gap:6px;

  padding:6px;

  background:var(--panel);

  border-bottom:1px solid var(--border);

  z-index:10;

  overflow:auto;
}

.toolbar button,
.toolbar select,
.toolbar input{

  height:34px;

  border:1px solid #888;

  background:#f2f2f2;

  padding:4px 8px;
}

.toolbar button{
  cursor:pointer;
}

canvas{
  position:absolute;

  top:56px;
  left:0;

  background:#fff;
}

/* ================= SNAP ================= */

.snap-indicator{

  position:fixed;

  width:10px;
  height:10px;

  border:2px solid red;

  border-radius:50%;

  pointer-events:none;

  z-index:100;

  display:none;
}

</style>
</head>
<body>

<!-- ================= TOOLBAR ================= -->

<div class="toolbar">

  <button onclick="CAD.setMode('select')">
    Select
  </button>

  <button onclick="CAD.setMode('line')">
    Line
  </button>

  <button onclick="CAD.setMode('circle')">
    Circle
  </button>

  <button onclick="CAD.setMode('text')">
    Text
  </button>

  <button onclick="CAD.setMode('dimension')">
    Dim
  </button>

  <!-- GRID -->

  <select id="gridSelect">
    <option value="1">1 mm</option>
    <option value="10" selected>10 mm</option>
    <option value="100">100 mm</option>
  </select>

  <!-- THICKNESS -->

  <select id="widthSelect">
    <option value="0.15">0.15</option>
    <option value="0.35" selected>0.35</option>
    <option value="0.6">0.60</option>
  </select>

  <!-- COLOR -->

  <input
    type="color"
    id="colorPicker"
    value="#000000"
  >

  <!-- TEXT -->

  <input
    id="textSize"
    type="number"
    value="3.5"
    step="0.1"
    style="width:70px"
  >

  <input
    id="textRotate"
    type="number"
    value="0"
    step="5"
    style="width:60px"
  >

  <!-- LAYERS -->

  <select id="layerSelect"></select>

  <button id="addLayer">
    +
  </button>

  <button id="toggleLayer">
    👁
  </button>

  <button id="colorLayer">
    🎨
  </button>

  <button id="deleteLayer">
    🗑
  </button>

</div>

<!-- ================= CANVAS ================= -->

<canvas id="cad"></canvas>

<div
  class="snap-indicator"
  id="snapIndicator"
></div>

<script>

/* ================= CAD ================= */

const CAD = {

  canvas:null,
  ctx:null,

  mode:"line",

  gridStep:10,

  lineWidth:0.35,

  color:"#000000",

  layer:"0",

  textSize:3.5,

  textRotation:0,

  temp:[],

  objects:[],

  selected:[],

  moving:false,

  dragSelect:false,

  dragStart:null,

  dragEnd:null,

  moveOffset:{x:0,y:0},

  layers:[

    {
      name:"0",
      color:"#000000",
      visible:true
    },

    {
      name:"Dimensions",
      color:"#0066ff",
      visible:true
    },

    {
      name:"Text",
      color:"#008800",
      visible:true
    }
  ],

  SNAP:{

    endpoint:true,

    midpoint:true,

    intersection:true,

    nearest:true,

    threshold:12
  },

  /* ================= INIT ================= */

  init(){

    this.canvas =
      document.getElementById("cad");

    this.ctx =
      this.canvas.getContext("2d");

    this.resize();

    window.addEventListener(
      "resize",
      ()=>this.resize()
    );

    this.bind();

    this.render();

    this.renderLayers();

    /* GRID */
    document
    .getElementById("gridSelect")
    .onchange = e=>{

      this.gridStep =
        Number(e.target.value);

      this.render();
    };

    /* WIDTH */
    document
    .getElementById("widthSelect")
    .onchange = e=>{

      this.lineWidth =
        Number(e.target.value);
    };

    /* COLOR */
    document
    .getElementById("colorPicker")
    .onchange = e=>{

      this.color =
        e.target.value;
    };

    /* TEXT SIZE */
    document
    .getElementById("textSize")
    .onchange = e=>{

      this.textSize =
        Number(e.target.value);
    };

    /* TEXT ROTATION */
    document
    .getElementById("textRotate")
    .onchange = e=>{

      this.textRotation =
        Number(e.target.value);
    };

    /* LAYERS */

    document
    .getElementById("layerSelect")
    .onchange = e=>{

      this.setLayer(
        e.target.value
      );
    };

    document
    .getElementById("addLayer")
    .onclick = ()=>{

      this.addLayer();
    };

    document
    .getElementById("toggleLayer")
    .onclick = ()=>{

      this.toggleLayer();
    };

    document
    .getElementById("colorLayer")
    .onclick = ()=>{

      this.colorLayer();
    };

    document
    .getElementById("deleteLayer")
    .onclick = ()=>{

      this.deleteLayer();
    };
  },

  /* ================= RESIZE ================= */

  resize(){

    this.canvas.width =
      window.innerWidth;

    this.canvas.height =
      window.innerHeight - 56;
  },

  /* ================= MODE ================= */

  setMode(m){

    this.mode = m;

    this.temp = [];
  },

  /* ================= EVENTS ================= */

  bind(){

    /* DELETE OBJECTS */

    document.addEventListener(
      "keydown",
      e=>{

        if(e.key === "Delete"){

          this.objects =
            this.objects.filter(
              o => !this.selected.includes(o)
            );

          this.selected = [];

          this.render();
        }
      }
    );

    /* MOUSE DOWN */

    this.canvas.addEventListener(
      "mousedown",
      e=>{

        const p =
          this.snap(
            this.mouse(e)
          );

        /* SELECT TOOL */

        if(this.mode === "select"){

          const hit =
            this.hit(p.x,p.y);

          if(hit){

            this.selected = [hit];

            this.moving = true;

            this.moveOffset = p;
          }

          else{

            this.selected = [];

            this.dragSelect = true;

            this.dragStart = p;

            this.dragEnd = p;
          }

          this.render();

          return;
        }

        /* LINE */

        if(this.mode === "line"){

          this.temp.push(p);

          if(this.temp.length === 2){

            this.objects.push({

              type:"line",

              x1:this.temp[0].x,
              y1:this.temp[0].y,

              x2:this.temp[1].x,
              y2:this.temp[1].y,

              width:this.lineWidth,

              color:this.color,

              layer:this.layer
            });

            this.temp = [];

            this.render();
          }
        }

        /* CIRCLE */

        if(this.mode === "circle"){

          this.temp.push(p);

          if(this.temp.length === 2){

            this.objects.push({

              type:"circle",

              x:this.temp[0].x,

              y:this.temp[0].y,

              r:this.dist(
                this.temp[0],
                this.temp[1]
              ),

              width:this.lineWidth,

              color:this.color,

              layer:this.layer
            });

            this.temp = [];

            this.render();
          }
        }

        /* TEXT */

        if(this.mode === "text"){

          const value =
            prompt("Text:");

          if(!value) return;

          this.objects.push({

            type:"text",

            x:p.x,

            y:p.y,

            text:value,

            size:this.textSize,

            rotation:this.textRotation,

            color:this.color,

            layer:this.layer
          });

          this.render();
        }

        /* DIMENSIONS */

        if(this.mode === "dimension"){

          this.temp.push(p);

          if(this.temp.length === 2){

            const a = this.temp[0];

            const b = this.temp[1];

            const dx =
              Math.abs(b.x-a.x);

            const dy =
              Math.abs(b.y-a.y);

            this.objects.push({

              type:"dimension",

              x1:a.x,
              y1:a.y,

              x2:b.x,
              y2:b.y,

              mode:
                dx >= dy
                ? "horizontal"
                : "vertical",

              color:this.color,

              layer:this.layer
            });

            this.temp = [];

            this.render();
          }
        }
      }
    );

    /* MOUSE MOVE */

    this.canvas.addEventListener(
      "mousemove",
      e=>{

        const p =
          this.snap(
            this.mouse(e)
          );

        this.showSnap(p);

        /* DRAG SELECT */

        if(this.dragSelect){

          this.dragEnd = p;

          this.render();
        }

        /* MOVE OBJECTS */

        if(this.moving){

          const dx =
            p.x - this.moveOffset.x;

          const dy =
            p.y - this.moveOffset.y;

          this.selected.forEach(o=>{

            if(
              o.type === "line" ||
              o.type === "dimension"
            ){

              o.x1 += dx;
              o.y1 += dy;

              o.x2 += dx;
              o.y2 += dy;
            }

            else if(
              o.type === "circle"
            ){

              o.x += dx;
              o.y += dy;
            }

            else if(
              o.type === "text"
            ){

              o.x += dx;
              o.y += dy;
            }
          });

          this.moveOffset = p;

          this.render();
        }
      }
    );

    /* MOUSE UP */

    window.addEventListener(
      "mouseup",
      ()=>{

        if(this.dragSelect){

          this.selectBox();

          this.dragSelect = false;
        }

        this.moving = false;

        this.render();
      }
    );
  },

  /* ================= MOUSE ================= */

  mouse(e){

    const r =
      this.canvas.getBoundingClientRect();

    return {

      x:e.clientX-r.left,

      y:e.clientY-r.top
    };
  },

  /* ================= SNAP ================= */

  snap(p){

    const pts = [];

    /* GRID */

    const g = this.gridStep;

    pts.push({

      x:
        Math.round(p.x/g)*g,

      y:
        Math.round(p.y/g)*g
    });

    /* OBJECTS */

    this.objects.forEach(o=>{

      /* LINE */

      if(o.type === "line"){

        if(this.SNAP.endpoint){

          pts.push({
            x:o.x1,
            y:o.y1
          });

          pts.push({
            x:o.x2,
            y:o.y2
          });
        }

        if(this.SNAP.midpoint){

          pts.push({

            x:(o.x1+o.x2)/2,

            y:(o.y1+o.y2)/2
          });
        }
      }

      /* CIRCLE */

      if(o.type === "circle"){

        pts.push({
          x:o.x,
          y:o.y
        });

        pts.push({
          x:o.x+o.r,
          y:o.y
        });

        pts.push({
          x:o.x-o.r,
          y:o.y
        });

        pts.push({
          x:o.x,
          y:o.y+o.r
        });

        pts.push({
          x:o.x,
          y:o.y-o.r
        });
      }
    });

    /* INTERSECTIONS */

    this.intersections()
      .forEach(i=>pts.push(i));

    let best = null;

    let min = Infinity;

    pts.forEach(c=>{

      const d =
        this.dist(p,c);

      if(
        d < this.SNAP.threshold &&
        d < min
      ){

        min = d;

        best = c;
      }
    });

    return best || p;
  },

  /* ================= INTERSECTIONS ================= */

  intersections(){

    const pts = [];

    const lines =
      this.objects.filter(
        o=>o.type==="line"
      );

    for(let i=0;i<lines.length;i++){

      for(let j=i+1;j<lines.length;j++){

        const a = lines[i];

        const b = lines[j];

        const p = this.intersect(

          a.x1,a.y1,
          a.x2,a.y2,

          b.x1,b.y1,
          b.x2,b.y2
        );

        if(p){
          pts.push(p);
        }
      }
    }

    return pts;
  },

  intersect(
    x1,y1,x2,y2,
    x3,y3,x4,y4
  ){

    const d =

      (x1-x2)*(y3-y4)

      -

      (y1-y2)*(x3-x4);

    if(d===0) return null;

    const xi =

      (
        (x3-x4)*(x1*y2-y1*x2)

        -

        (x1-x2)*(x3*y4-y3*x4)
      ) / d;

    const yi =

      (
        (y3-y4)*(x1*y2-y1*x2)

        -

        (y1-y2)*(x3*y4-y3*x4)
      ) / d;

    return {
      x:xi,
      y:yi
    };
  },

  /* ================= DIST ================= */

  dist(a,b){

    return Math.hypot(
      a.x-b.x,
      a.y-b.y
    );
  },

  /* ================= GRID ================= */

  drawGrid(){

    const ctx = this.ctx;

    ctx.strokeStyle = "#eee";

    ctx.lineWidth = 1;

    for(
      let x=0;
      x<this.canvas.width;
      x+=this.gridStep
    ){

      ctx.beginPath();

      ctx.moveTo(x,0);

      ctx.lineTo(
        x,
        this.canvas.height
      );

      ctx.stroke();
    }

    for(
      let y=0;
      y<this.canvas.height;
      y+=this.gridStep
    ){

      ctx.beginPath();

      ctx.moveTo(0,y);

      ctx.lineTo(
        this.canvas.width,
        y
      );

      ctx.stroke();
    }
  },

  /* ================= RENDER ================= */

  render(){

    const ctx = this.ctx;

    ctx.clearRect(
      0,
      0,
      this.canvas.width,
      this.canvas.height
    );

    this.drawGrid();

    this.objects.forEach(o=>{

      if(
        !this.layerVisible(o.layer)
      ) return;

      ctx.strokeStyle = o.color;

      ctx.fillStyle = o.color;

      ctx.lineWidth =
        this.mmToPx(
          o.width || 0.35
        );

      /* LINE */

      if(o.type === "line"){

        ctx.beginPath();

        ctx.moveTo(o.x1,o.y1);

        ctx.lineTo(o.x2,o.y2);

        ctx.stroke();
      }

      /* CIRCLE */

      else if(o.type === "circle"){

        ctx.beginPath();

        ctx.arc(
          o.x,
          o.y,
          o.r,
          0,
          Math.PI*2
        );

        ctx.stroke();
      }

      /* TEXT */

      else if(o.type === "text"){

        ctx.save();

        ctx.translate(o.x,o.y);

        ctx.rotate(
          o.rotation *
          Math.PI/180
        );

        const px =
          o.size * 3.78;

        ctx.font =
          `${px}px Arial`;

        ctx.fillText(
          o.text,
          0,
          0
        );

        ctx.restore();
      }

      /* DIMENSIONS */

      else if(
        o.type === "dimension"
      ){

        this.drawDimension(o);
      }
    });

    this.renderSelection();
  },

  /* ================= DIMENSIONS ================= */

  drawDimension(d){

    const ctx = this.ctx;

    const off = 30;

    ctx.strokeStyle = d.color;

    ctx.fillStyle = d.color;

    ctx.lineWidth = 1;

    /* HORIZONTAL */

    if(d.mode === "horizontal"){

      const y =
        Math.min(d.y1,d.y2)
        - off;

      this.line(d.x1,d.y1,d.x1,y);

      this.line(d.x2,d.y2,d.x2,y);

      this.line(d.x1,y,d.x2,y);

      this.arrow(d.x1,y,180);

      this.arrow(d.x2,y,0);

      ctx.fillText(

        Math.abs(
          d.x2-d.x1
        ).toFixed(0),

        (d.x1+d.x2)/2,

        y-6
      );
    }

    /* VERTICAL */

    else{

      const x =
        Math.max(d.x1,d.x2)
        + off;

      this.line(d.x1,d.y1,x,d.y1);

      this.line(d.x2,d.y2,x,d.y2);

      this.line(x,d.y1,x,d.y2);

      this.arrow(x,d.y1,-90);

      this.arrow(x,d.y2,90);

      ctx.save();

      ctx.translate(

        x+12,

        (d.y1+d.y2)/2
      );

      ctx.rotate(
        -Math.PI/2
      );

      ctx.fillText(

        Math.abs(
          d.y2-d.y1
        ).toFixed(0),

        0,
        0
      );

      ctx.restore();
    }
  },

  /* ================= HELPERS ================= */

  line(x1,y1,x2,y2){

    const ctx = this.ctx;

    ctx.beginPath();

    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);

    ctx.stroke();
  },

  arrow(x,y,a){

    const ctx = this.ctx;

    const s = 8;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(
      a*Math.PI/180
    );

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.lineTo(-s,-s/2);

    ctx.moveTo(0,0);

    ctx.lineTo(-s,s/2);

    ctx.stroke();

    ctx.restore();
  },

  mmToPx(mm){

    return mm * 3;
  },

  /* ================= HIT ================= */

  hit(x,y){

    for(const o of this.objects){

      /* LINE */

      if(o.type === "line"){

        const d =
          this.pointSegDist(

            x,y,

            o.x1,o.y1,

            o.x2,o.y2
          );

        if(d < 8){
          return o;
        }
      }

      /* CIRCLE */

      if(o.type === "circle"){

        const d =
          Math.abs(

            Math.hypot(
              x-o.x,
              y-o.y
            )

            - o.r
          );

        if(d < 8){
          return o;
        }
      }

      /* TEXT */

      if(o.type === "text"){

        if(

          x > o.x &&
          x < o.x + 100 &&

          y < o.y &&
          y > o.y - 24
        ){

          return o;
        }
      }

      /* DIM */

      if(o.type === "dimension"){

        const d =
          this.pointSegDist(

            x,y,

            o.x1,o.y1,

            o.x2,o.y2
          );

        if(d < 10){
          return o;
        }
      }
    }

    return null;
  },

  pointSegDist(
    px,py,
    x1,y1,
    x2,y2
  ){

    const A = px-x1;

    const B = py-y1;

    const C = x2-x1;

    const D = y2-y1;

    const dot =
      A*C + B*D;

    const len =
      C*C + D*D;

    let t = dot/len;

    t = Math.max(
      0,
      Math.min(1,t)
    );

    const xx =
      x1 + t*C;

    const yy =
      y1 + t*D;

    return Math.hypot(
      px-xx,
      py-yy
    );
  },

  /* ================= BOX SELECT ================= */

  selectBox(){

    const minX =
      Math.min(
        this.dragStart.x,
        this.dragEnd.x
      );

    const maxX =
      Math.max(
        this.dragStart.x,
        this.dragEnd.x
      );

    const minY =
      Math.min(
        this.dragStart.y,
        this.dragEnd.y
      );

    const maxY =
      Math.max(
        this.dragStart.y,
        this.dragEnd.y
      );

    this.selected = [];

    this.objects.forEach(o=>{

      let x=0;
      let y=0;

      if(
        o.type === "line"
      ){

        x = o.x1;
        y = o.y1;
      }

      else if(
        o.type === "circle"
      ){

        x = o.x;
        y = o.y;
      }

      else if(
        o.type === "text"
      ){

        x = o.x;
        y = o.y;
      }

      else if(
        o.type === "dimension"
      ){

        x = o.x1;
        y = o.y1;
      }

      if(

        x >= minX &&
        x <= maxX &&

        y >= minY &&
        y <= maxY
      ){

        this.selected.push(o);
      }
    });
  },

  /* ================= SELECTION RENDER ================= */

  renderSelection(){

    const ctx = this.ctx;

    /* DRAG RECT */

    if(this.dragSelect){

      ctx.strokeStyle = "#4a90ff";

      ctx.setLineDash([5,5]);

      ctx.strokeRect(

        this.dragStart.x,

        this.dragStart.y,

        this.dragEnd.x -
        this.dragStart.x,

        this.dragEnd.y -
        this.dragStart.y
      );

      ctx.setLineDash([]);
    }

    /* OBJECTS */

    this.selected.forEach(o=>{

      ctx.strokeStyle = "#4a90ff";

      ctx.lineWidth = 2;

      /* LINE */

      if(o.type==="line"){

        this.line(

          o.x1,o.y1,

          o.x2,o.y2
        );
      }

      /* CIRCLE */

      if(o.type==="circle"){

        ctx.beginPath();

        ctx.arc(

          o.x,
          o.y,
          o.r,

          0,
          Math.PI*2
        );

        ctx.stroke();
      }

      /* TEXT */

      if(o.type==="text"){

        ctx.strokeRect(

          o.x-4,

          o.y-20,

          100,

          24
        );
      }

      /* DIMENSION */

      if(o.type==="dimension"){

        ctx.strokeRect(

          Math.min(
            o.x1,
            o.x2
          ) - 10,

          Math.min(
            o.y1,
            o.y2
          ) - 10,

          Math.abs(
            o.x2-o.x1
          ) + 20,

          Math.abs(
            o.y2-o.y1
          ) + 20
        );
      }
    });
  },

  /* ================= LAYERS ================= */

  renderLayers(){

    const s =
      document.getElementById(
        "layerSelect"
      );

    s.innerHTML = "";

    this.layers.forEach(l=>{

      const o =
        document.createElement(
          "option"
        );

      o.value = l.name;

      o.textContent = l.name;

      s.appendChild(o);
    });
  },

  addLayer(){

    const name =
      prompt("Layer:");

    if(!name) return;

    const color =
      prompt(
        "HEX Color",
        "#000000"
      );

    this.layers.push({

      name,

      color:
        color || "#000000",

      visible:true
    });

    this.renderLayers();
  },

  setLayer(name){

    this.layer = name;

    const l =
      this.layers.find(
        v=>v.name===name
      );

    if(l){

      this.color = l.color;

      document
      .getElementById(
        "colorPicker"
      )
      .value = l.color;
    }
  },

  toggleLayer(){

    const l =
      this.layers.find(
        v=>v.name===this.layer
      );

    if(!l) return;

    l.visible = !l.visible;

    this.render();
  },

  colorLayer(){

    const l =
      this.layers.find(
        v=>v.name===this.layer
      );

    if(!l) return;

    const c =
      prompt(
        "Layer Color",
        l.color
      );

    if(!c) return;

    l.color = c;

    this.color = c;

    this.render();
  },

  deleteLayer(){

    if(this.layer === "0"){

      alert("Layer 0 protected");

      return;
    }

    this.objects =
      this.objects.filter(
        o => o.layer !== this.layer
      );

    this.layers =
      this.layers.filter(
        l => l.name !== this.layer
      );

    this.layer = "0";

    this.renderLayers();

    this.render();
  },

  layerVisible(name){

    const l =
      this.layers.find(
        v=>v.name===name
      );

    if(!l) return true;

    return l.visible;
  },

  /* ================= SNAP UI ================= */

  showSnap(p){

    const el =
      document.getElementById(
        "snapIndicator"
      );

    el.style.display = "block";

    el.style.left =
      `${p.x-5}px`;

    el.style.top =
      `${p.y+50}px`;
  }
};

/* ================= START ================= */

window.addEventListener(
  "load",
  ()=>CAD.init()
);

</script>
</body>
</html>
