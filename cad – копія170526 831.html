<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CAD Lite</title>

<style>

:root{
  --bg:#d4d4d4;
  --panel:#e6e6e6;
  --border:#999;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  font-family:Segoe UI;
  background:var(--bg);
}

.toolbar{
  position:fixed;
  top:0;
  left:0;
  right:0;

  height:56px;

  display:flex;
  align-items:center;
  gap:6px;

  padding:6px;

  background:var(--panel);

  border-bottom:1px solid var(--border);

  z-index:10;

  overflow:auto;
}

.toolbar button,
.toolbar select,
.toolbar input{
  height:34px;
  border:1px solid #888;
  background:#f2f2f2;
  padding:4px 8px;
}

.toolbar button{
  cursor:pointer;
}

canvas{
  position:absolute;
  top:56px;
  left:0;
  background:#fff;
}

.snap-indicator{
  position:fixed;
  width:10px;
  height:10px;
  border:2px solid red;
  border-radius:50%;
  pointer-events:none;
  z-index:100;
  display:none;
}

</style>
</head>
<body>

<div class="toolbar">

  <button onclick="location.href='index.html'">←</button>

  <button onclick="CAD.setMode('select')">Select</button>
  <button onclick="CAD.setMode('line')">Line</button>
  <button onclick="CAD.setMode('circle')">Circle</button>
  <button onclick="CAD.setMode('text')">Text</button>
  <button onclick="CAD.setMode('dimension')">Dim</button>
  <button onclick="CAD.setMode('trim')">Trim</button>
  <button onclick="CAD.setMode('brush')">Brush</button>

  <button id="undoBtn">Undo</button>

  <select id="gridSelect">
    <option value="1">1 mm</option>
    <option value="10" selected>10 mm</option>
    <option value="100">100 mm</option>
  </select>

  <select id="widthSelect">
    <option value="0.15">0.15</option>
    <option value="0.35" selected>0.35</option>
    <option value="0.6">0.60</option>
  </select>

  <input
    type="color"
    id="colorPicker"
    value="#000000"
  >

  <input
    id="textSize"
    type="number"
    value="3.5"
    step="0.1"
    style="width:70px"
  >

  <input
    id="textRotate"
    type="number"
    value="0"
    step="5"
    style="width:60px"
  >

  <select id="layerSelect"></select>

  <button id="addLayer">+</button>
  <button id="toggleLayer">👁</button>
  <button id="deleteLayer">🗑</button>

  <button id="exportBtn">Export</button>
  <button id="importBtn">Import</button>
  <button id="pngBtn">PNG</button>

</div>

<canvas id="cad"></canvas>

<div
  class="snap-indicator"
  id="snapIndicator"
></div>

<script>

const CAD = {

  canvas:null,
  ctx:null,

  storageKey:"cad-lite-project",

  mode:"line",

  gridStep:10,

  lineWidth:0.35,

  color:"#000000",

  layer:"0",

  textSize:3.5,

  textRotation:0,

  temp:[],

  objects:[],

  selected:[],

  moving:false,

  resizing:false,

  activeHandle:null,

  dragSelect:false,

  dragStart:null,

  dragEnd:null,

  moveOffset:{x:0,y:0},

  brushSource:null,

  undoStack:[],

  SNAP:{
    endpoint:true,
    midpoint:true,
    intersection:true,
    nearest:true,
    threshold:12
  },

  layers:[

    {
      name:"0",
      color:"#000000",
      visible:true
    },

    {
      name:"Dimensions",
      color:"#0066ff",
      visible:true
    },

    {
      name:"Text",
      color:"#008800",
      visible:true
    }
  ],

  init(){

    this.loadLocal();

    this.canvas =
      document.getElementById("cad");

    this.ctx =
      this.canvas.getContext("2d");

    this.resize();

    window.addEventListener(
      "resize",
      ()=>this.resize()
    );

    this.bind();

    this.renderLayers();

    this.render();

    document
    .getElementById("gridSelect")
    .value = this.gridStep;

    document
    .getElementById("widthSelect")
    .value = this.lineWidth;

    document
    .getElementById("colorPicker")
    .value = this.color;

    document
    .getElementById("gridSelect")
    .onchange = e=>{

      this.gridStep =
        Number(e.target.value);

      this.saveLocal();

      this.render();
    };

    document
    .getElementById("widthSelect")
    .onchange = e=>{

      this.lineWidth =
        Number(e.target.value);

      this.saveLocal();
    };

    document
    .getElementById("colorPicker")
    .onchange = e=>{

      this.color =
        e.target.value;

      this.saveLocal();
    };

    document
    .getElementById("textSize")
    .onchange = e=>{

      this.textSize =
        Number(e.target.value);
    };

    document
    .getElementById("textRotate")
    .onchange = e=>{

      this.textRotation =
        Number(e.target.value);
    };

    document
    .getElementById("layerSelect")
    .onchange = e=>{

      this.setLayer(
        e.target.value
      );
    };

    document
    .getElementById("addLayer")
    .onclick = ()=>{

      this.addLayer();
    };

    document
    .getElementById("toggleLayer")
    .onclick = ()=>{

      this.toggleLayer();
    };

    document
    .getElementById("deleteLayer")
    .onclick = ()=>{

      this.deleteLayer();
    };

    document
    .getElementById("exportBtn")
    .onclick = ()=>{

      this.exportJSON();
    };

    document
    .getElementById("importBtn")
    .onclick = ()=>{

      this.importJSON();
    };

    document
    .getElementById("pngBtn")
    .onclick = ()=>{

      this.savePNG();
    };

    document
    .getElementById("undoBtn")
    .onclick = ()=>{

      this.undo();
    };
  },

  pushUndo(){

    this.undoStack.push(
      JSON.stringify({
        objects:this.objects,
        layers:this.layers
      })
    );

    if(this.undoStack.length > 50){

      this.undoStack.shift();
    }
  },

  undo(){

    if(!this.undoStack.length) return;

    const state =
      JSON.parse(
        this.undoStack.pop()
      );

    this.objects =
      state.objects || [];

    this.layers =
      state.layers || this.layers;

    this.selected = [];

    this.renderLayers();

    this.saveLocal();

    this.render();
  },

  resize(){

    this.canvas.width =
      window.innerWidth;

    this.canvas.height =
      window.innerHeight - 56;

    this.render();
  },

  setMode(m){

    this.mode = m;

    this.temp = [];

    this.brushSource = null;
  },

  saveLocal(){

    const data = {

      objects:this.objects,

      layers:this.layers,

      layer:this.layer,

      color:this.color,

      gridStep:this.gridStep,

      lineWidth:this.lineWidth
    };

    localStorage.setItem(
      this.storageKey,
      JSON.stringify(data)
    );
  },

  loadLocal(){

    const raw =
      localStorage.getItem(
        this.storageKey
      );

    if(!raw) return;

    try{

      const data =
        JSON.parse(raw);

      this.objects =
        data.objects || [];

      this.layers =
        data.layers || this.layers;

      this.layer =
        data.layer || "0";

      this.color =
        data.color || "#000000";

      this.gridStep =
        data.gridStep || 10;

      this.lineWidth =
        data.lineWidth || 0.35;

    }catch(err){

      console.log(err);
    }
  },

  getLayerColor(name){

    const layer =
      this.layers.find(
        l=>l.name===name
      );

    return layer
      ? layer.color
      : "#000000";
  },

  bind(){

    document.addEventListener(
      "keydown",
      e=>{

        if(e.key === "Delete"){

          if(!this.selected.length) return;

          this.pushUndo();

          this.objects =
            this.objects.filter(
              o => !this.selected.includes(o)
            );

          this.selected = [];

          this.saveLocal();

          this.render();
        }
      }
    );

    this.canvas.addEventListener(
      "mousedown",
      e=>{

        const p =
          this.snap(
            this.mouse(e)
          );

        const handle =
          this.hitHandle(
            p.x,p.y
          );

        if(handle){

          this.pushUndo();

          this.resizing = true;

          this.activeHandle = handle;

          return;
        }

        /* BRUSH */

        if(this.mode === "brush"){

          const hit =
            this.hit(p.x,p.y);

          if(!hit) return;

          if(!this.brushSource){

            this.brushSource = {

              color:hit.color,

              width:hit.width,

              layer:hit.layer
            };

            return;
          }

          this.pushUndo();

          hit.color =
            this.brushSource.color;

          hit.width =
            this.brushSource.width;

          hit.layer =
            this.brushSource.layer;

          this.brushSource = null;

          this.saveLocal();

          this.render();

          return;
        }

        /* TRIM */

        if(this.mode === "trim"){

          const hit =
            this.hit(p.x,p.y);

          if(!hit) return;

          this.pushUndo();

          if(hit.type === "line"){

            const ints =
              this.intersections()
              .filter(i=>{

                return this.pointSegDist(
                  i.x,i.y,
                  hit.x1,hit.y1,
                  hit.x2,hit.y2
                ) < 2;
              });

            if(ints.length){

              let nearest = ints[0];

              let min =
                this.dist(p,nearest);

              ints.forEach(i=>{

                const d =
                  this.dist(p,i);

                if(d < min){

                  min = d;

                  nearest = i;
                }
              });

              const d1 =
                this.dist(
                  p,
                  {
                    x:hit.x1,
                    y:hit.y1
                  }
                );

              const d2 =
                this.dist(
                  p,
                  {
                    x:hit.x2,
                    y:hit.y2
                  }
                );

              if(d1 < d2){

                hit.x1 = nearest.x;
                hit.y1 = nearest.y;
              }

              else{

                hit.x2 = nearest.x;
                hit.y2 = nearest.y;
              }

              this.saveLocal();

              this.render();
            }
          }

          if(hit.type === "circle"){

            hit.trimmed = true;

            hit.trimAngle =
              Math.atan2(
                p.y-hit.y,
                p.x-hit.x
              );

            this.saveLocal();

            this.render();
          }

          return;
        }

        /* SELECT */

        if(this.mode === "select"){

          const hit =
            this.hit(
              p.x,p.y
            );

          if(hit){

            this.selected = [hit];

            this.moving = true;

            this.moveOffset = p;

            this.pushUndo();
          }

          else{

            this.selected = [];

            this.dragSelect = true;

            this.dragStart = p;

            this.dragEnd = p;
          }

          this.render();

          return;
        }

        /* LINE */

        if(this.mode === "line"){

          this.temp.push(p);

          if(this.temp.length === 2){

            this.pushUndo();

            this.objects.push({

              type:"line",

              x1:this.temp[0].x,
              y1:this.temp[0].y,

              x2:this.temp[1].x,
              y2:this.temp[1].y,

              width:this.lineWidth,

              color:this.getLayerColor(this.layer),

              customColor:false,

              layer:this.layer
            });

            this.temp = [];

            this.saveLocal();

            this.render();
          }
        }

        /* CIRCLE */

        if(this.mode === "circle"){

          this.temp.push(p);

          if(this.temp.length === 2){

            this.pushUndo();

            this.objects.push({

              type:"circle",

              x:this.temp[0].x,

              y:this.temp[0].y,

              r:this.dist(
                this.temp[0],
                this.temp[1]
              ),

              width:this.lineWidth,

              color:this.getLayerColor(this.layer),

              customColor:false,

              layer:this.layer
            });

            this.temp = [];

            this.saveLocal();

            this.render();
          }
        }

        /* TEXT */

        if(this.mode === "text"){

          const value =
            prompt("Text:");

          if(!value) return;

          this.pushUndo();

          this.objects.push({

            type:"text",

            x:p.x,
            y:p.y,

            text:value,

            size:this.textSize,

            rotation:this.textRotation,

            color:this.getLayerColor(this.layer),

            customColor:false,

            layer:this.layer
          });

          this.saveLocal();

          this.render();
        }

        /* DIMENSION */

        if(this.mode === "dimension"){

          this.temp.push(p);

          if(this.temp.length === 2){

            const a = this.temp[0];
            const b = this.temp[1];

            this.pushUndo();

            this.objects.push({

              type:"dimension",

              x1:a.x,
              y1:a.y,

              x2:b.x,
              y2:b.y,

              width:0.15,

              color:this.getLayerColor(this.layer),

              customColor:false,

              layer:this.layer
            });

            this.temp = [];

            this.saveLocal();

            this.render();
          }
        }
      }
    );

    this.canvas.addEventListener(
      "mousemove",
      e=>{

        const p =
          this.snap(
            this.mouse(e)
          );

        this.showSnap(p);

        if(this.resizing){

          const h =
            this.activeHandle;

          if(h.obj.type === "line"){

            if(h.point === "start"){

              h.obj.x1 = p.x;
              h.obj.y1 = p.y;
            }

            else{

              h.obj.x2 = p.x;
              h.obj.y2 = p.y;
            }
          }

          if(h.obj.type === "circle"){

            h.obj.r =
              this.dist(
                {
                  x:h.obj.x,
                  y:h.obj.y
                },
                p
              );
          }

          this.render();

          return;
        }

        if(this.dragSelect){

          this.dragEnd = p;

          this.render();
        }

        if(this.moving){

          const dx =
            p.x - this.moveOffset.x;

          const dy =
            p.y - this.moveOffset.y;

          this.selected.forEach(o=>{

            if(
              o.type === "line" ||
              o.type === "dimension"
            ){

              o.x1 += dx;
              o.y1 += dy;

              o.x2 += dx;
              o.y2 += dy;
            }

            else if(o.type === "circle"){

              o.x += dx;
              o.y += dy;
            }

            else if(o.type === "text"){

              o.x += dx;
              o.y += dy;
            }
          });

          this.moveOffset = p;

          this.render();
        }
      }
    );

    window.addEventListener(
      "mouseup",
      ()=>{

        this.moving = false;

        this.resizing = false;

        this.activeHandle = null;

        if(this.dragSelect){

          this.selectBox();

          this.dragSelect = false;
        }

        this.saveLocal();

        this.render();
      }
    );
  },

  mouse(e){

    const r =
      this.canvas.getBoundingClientRect();

    return {

      x:e.clientX-r.left,

      y:e.clientY-r.top
    };
  },

  snap(p){

    const pts = [];

    const g = this.gridStep;

    pts.push({

      x:
        Math.round(p.x/g)*g,

      y:
        Math.round(p.y/g)*g
    });

    this.objects.forEach(o=>{

      if(o.type === "line"){

        pts.push({
          x:o.x1,
          y:o.y1
        });

        pts.push({
          x:o.x2,
          y:o.y2
        });

        pts.push({

          x:(o.x1+o.x2)/2,

          y:(o.y1+o.y2)/2
        });
      }

      if(o.type === "circle"){

        pts.push({
          x:o.x,
          y:o.y
        });
      }
    });

    this.intersections()
      .forEach(i=>pts.push(i));

    let best = null;
    let min = Infinity;

    pts.forEach(c=>{

      const d =
        this.dist(p,c);

      if(
        d < this.SNAP.threshold &&
        d < min
      ){

        min = d;

        best = c;
      }
    });

    return best || p;
  },

  intersections(){

    const pts = [];

    const lines =
      this.objects.filter(
        o=>o.type==="line"
      );

    for(let i=0;i<lines.length;i++){

      for(let j=i+1;j<lines.length;j++){

        const a = lines[i];
        const b = lines[j];

        const p = this.intersect(

          a.x1,a.y1,
          a.x2,a.y2,

          b.x1,b.y1,
          b.x2,b.y2
        );

        if(p){
          pts.push(p);
        }
      }
    }

    return pts;
  },

  intersect(
    x1,y1,x2,y2,
    x3,y3,x4,y4
  ){

    const d =
      (x1-x2)*(y3-y4)
      -
      (y1-y2)*(x3-x4);

    if(d===0) return null;

    const xi =
      (
        (x3-x4)*(x1*y2-y1*x2)
        -
        (x1-x2)*(x3*y4-y3*x4)
      ) / d;

    const yi =
      (
        (y3-y4)*(x1*y2-y1*x2)
        -
        (y1-y2)*(x3*y4-y3*x4)
      ) / d;

    return {
      x:xi,
      y:yi
    };
  },

  dist(a,b){

    return Math.hypot(
      a.x-b.x,
      a.y-b.y
    );
  },

  drawGrid(){

    const ctx = this.ctx;

    ctx.strokeStyle = "#eee";

    ctx.lineWidth = 1;

    for(
      let x=0;
      x<this.canvas.width;
      x+=this.gridStep
    ){

      ctx.beginPath();

      ctx.moveTo(x,0);

      ctx.lineTo(
        x,
        this.canvas.height
      );

      ctx.stroke();
    }

    for(
      let y=0;
      y<this.canvas.height;
      y+=this.gridStep
    ){

      ctx.beginPath();

      ctx.moveTo(0,y);

      ctx.lineTo(
        this.canvas.width,
        y
      );

      ctx.stroke();
    }
  },

  render(){

    const ctx = this.ctx;

    ctx.clearRect(
      0,
      0,
      this.canvas.width,
      this.canvas.height
    );

    this.drawGrid();

    this.objects.forEach(o=>{

      if(
        !this.layerVisible(o.layer)
      ) return;

      ctx.strokeStyle = o.color;

      ctx.fillStyle = o.color;

      ctx.lineWidth =
        this.mmToPx(
          o.width || 0.35
        );

      if(o.type === "line"){

        ctx.beginPath();

        ctx.moveTo(o.x1,o.y1);

        ctx.lineTo(o.x2,o.y2);

        ctx.stroke();
      }

      else if(o.type === "circle"){

        ctx.beginPath();

        if(o.trimmed){

          ctx.arc(
            o.x,
            o.y,
            o.r,
            o.trimAngle,
            o.trimAngle + Math.PI*1.5
          );
        }

        else{

          ctx.arc(
            o.x,
            o.y,
            o.r,
            0,
            Math.PI*2
          );
        }

        ctx.stroke();
      }

      else if(o.type === "text"){

        ctx.save();

        ctx.translate(o.x,o.y);

        ctx.rotate(
          o.rotation *
          Math.PI/180
        );

        ctx.font =
          `${o.size*3.78}px Arial`;

        ctx.fillText(
          o.text,
          0,
          0
        );

        ctx.restore();
      }

      else if(o.type === "dimension"){

        this.drawDimension(o);
      }
    });

    this.renderSelection();
  },

  drawDimension(d){

    const ctx = this.ctx;

    ctx.strokeStyle = d.color;

    ctx.fillStyle = d.color;

    ctx.lineWidth =
      this.mmToPx(0.15);

    const dx = d.x2 - d.x1;
    const dy = d.y2 - d.y1;

    let angle =
      Math.atan2(dy,dx);

    if(
      angle > Math.PI/2 ||
      angle < -Math.PI/2
    ){
      angle += Math.PI;
    }

    const offset = 25;

    const nx =
      -Math.sin(angle);

    const ny =
      Math.cos(angle);

    const ox = nx * offset;
    const oy = ny * offset;

    const sx1 = d.x1 + ox;
    const sy1 = d.y1 + oy;

    const sx2 = d.x2 + ox;
    const sy2 = d.y2 + oy;

    this.line(
      d.x1,d.y1,
      sx1,sy1
    );

    this.line(
      d.x2,d.y2,
      sx2,sy2
    );

    this.line(
      sx1,sy1,
      sx2,sy2
    );

    this.arrow(
      sx1,
      sy1,
      angle + Math.PI
    );

    this.arrow(
      sx2,
      sy2,
      angle
    );

    const dist =
      Math.hypot(dx,dy)
      .toFixed(0);

    ctx.save();

    ctx.translate(
      (sx1+sx2)/2,
      (sy1+sy2)/2
    );

    ctx.rotate(angle);

    ctx.font = "12px Arial";

    ctx.fillText(
      dist,
      0,
      -6
    );

    ctx.restore();
  },

  arrow(x,y,angle){

    const ctx = this.ctx;

    const size = 8;

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(angle);

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.lineTo(-size,-size/2);

    ctx.lineTo(-size,size/2);

    ctx.closePath();

    ctx.fill();

    ctx.restore();
  },

  line(x1,y1,x2,y2){

    const ctx = this.ctx;

    ctx.beginPath();

    ctx.moveTo(x1,y1);

    ctx.lineTo(x2,y2);

    ctx.stroke();
  },

  mmToPx(mm){

    return mm * 3;
  },

  hit(x,y){

    for(const o of this.objects){

      if(o.type === "line"){

        const d =
          this.pointSegDist(
            x,y,
            o.x1,o.y1,
            o.x2,o.y2
          );

        if(d < 8){
          return o;
        }
      }

      if(o.type === "dimension"){

        const d =
          this.pointSegDist(
            x,y,
            o.x1,o.y1,
            o.x2,o.y2
          );

        if(d < 10){
          return o;
        }
      }

      if(o.type === "circle"){

        const d =
          Math.abs(
            Math.hypot(
              x-o.x,
              y-o.y
            )
            - o.r
          );

        if(d < 8){
          return o;
        }
      }

      if(o.type === "text"){

        if(
          x > o.x &&
          x < o.x + 100 &&
          y < o.y &&
          y > o.y - 24
        ){

          return o;
        }
      }
    }

    return null;
  },

  hitHandle(x,y){

    for(const o of this.selected){

      if(o.type === "line"){

        if(
          this.dist(
            {x,y},
            {
              x:o.x1,
              y:o.y1
            }
          ) < 10
        ){

          return {
            obj:o,
            point:"start"
          };
        }

        if(
          this.dist(
            {x,y},
            {
              x:o.x2,
              y:o.y2
            }
          ) < 10
        ){

          return {
            obj:o,
            point:"end"
          };
        }
      }

      if(o.type === "circle"){

        const p = {
          x:o.x+o.r,
          y:o.y
        };

        if(
          this.dist({x,y},p) < 10
        ){

          return {
            obj:o,
            point:"radius"
          };
        }
      }
    }

    return null;
  },

  pointSegDist(
    px,py,
    x1,y1,
    x2,y2
  ){

    const A = px-x1;
    const B = py-y1;

    const C = x2-x1;
    const D = y2-y1;

    const dot =
      A*C + B*D;

    const len =
      C*C + D*D;

    let t = dot/len;

    t = Math.max(
      0,
      Math.min(1,t)
    );

    const xx =
      x1 + t*C;

    const yy =
      y1 + t*D;

    return Math.hypot(
      px-xx,
      py-yy
    );
  },

  selectBox(){

    const minX =
      Math.min(
        this.dragStart.x,
        this.dragEnd.x
      );

    const maxX =
      Math.max(
        this.dragStart.x,
        this.dragEnd.x
      );

    const minY =
      Math.min(
        this.dragStart.y,
        this.dragEnd.y
      );

    const maxY =
      Math.max(
        this.dragStart.y,
        this.dragEnd.y
      );

    this.selected = [];

    this.objects.forEach(o=>{

      let x=0;
      let y=0;

      if(
        o.type === "line" ||
        o.type === "dimension"
      ){

        x = o.x1;
        y = o.y1;
      }

      else if(o.type === "circle"){

        x = o.x;
        y = o.y;
      }

      else if(o.type === "text"){

        x = o.x;
        y = o.y;
      }

      if(
        x >= minX &&
        x <= maxX &&
        y >= minY &&
        y <= maxY
      ){

        this.selected.push(o);
      }
    });
  },

  renderSelection(){

    const ctx = this.ctx;

    if(this.dragSelect){

      ctx.strokeStyle = "#4a90ff";

      ctx.setLineDash([5,5]);

      ctx.strokeRect(

        this.dragStart.x,

        this.dragStart.y,

        this.dragEnd.x -
        this.dragStart.x,

        this.dragEnd.y -
        this.dragStart.y
      );

      ctx.setLineDash([]);
    }

    this.selected.forEach(o=>{

      ctx.strokeStyle = "#4a90ff";

      ctx.lineWidth = 2;

      if(
        o.type==="line" ||
        o.type==="dimension"
      ){

        this.line(
          o.x1,o.y1,
          o.x2,o.y2
        );

        this.handle(
          o.x1,o.y1
        );

        this.handle(
          o.x2,o.y2
        );
      }

      if(o.type==="circle"){

        ctx.beginPath();

        ctx.arc(
          o.x,
          o.y,
          o.r,
          0,
          Math.PI*2
        );

        ctx.stroke();

        this.handle(
          o.x+o.r,
          o.y
        );
      }
    });
  },

  handle(x,y){

    const ctx = this.ctx;

    ctx.fillStyle =
      "#4a90ff";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      5,
      0,
      Math.PI*2
    );

    ctx.fill();
  },

  renderLayers(){

    const s =
      document.getElementById(
        "layerSelect"
      );

    s.innerHTML = "";

    this.layers.forEach(l=>{

      const o =
        document.createElement(
          "option"
        );

      o.value = l.name;

      o.textContent =
        `⬛ ${l.name}`;

      o.style.color = l.color;

      s.appendChild(o);
    });

    s.value = this.layer;
  },

  addLayer(){

    const name =
      prompt("Layer:");

    if(!name) return;

    const color =
      prompt(
        "Layer color:",
        "#000000"
      );

    this.pushUndo();

    this.layers.push({

      name,

      color:color || "#000000",

      visible:true
    });

    this.saveLocal();

    this.renderLayers();
  },

  setLayer(name){

    this.layer = name;

    const layer =
      this.layers.find(
        l=>l.name===name
      );

    if(layer){

      this.color = layer.color;

      document
      .getElementById("colorPicker")
      .value = layer.color;
    }

    this.saveLocal();
  },

  toggleLayer(){

    const l =
      this.layers.find(
        v=>v.name===this.layer
      );

    if(!l) return;

    this.pushUndo();

    l.visible = !l.visible;

    this.saveLocal();

    this.render();
  },

  deleteLayer(){

    if(this.layer === "0"){

      alert("Layer 0 protected");

      return;
    }

    this.pushUndo();

    this.objects =
      this.objects.filter(
        o => o.layer !== this.layer
      );

    this.layers =
      this.layers.filter(
        l => l.name !== this.layer
      );

    this.layer = "0";

    this.saveLocal();

    this.renderLayers();

    this.render();
  },

  layerVisible(name){

    const l =
      this.layers.find(
        v=>v.name===name
      );

    if(!l) return true;

    return l.visible;
  },

  showSnap(p){

    const el =
      document.getElementById(
        "snapIndicator"
      );

    el.style.display =
      "block";

    el.style.left =
      `${p.x-5}px`;

    el.style.top =
      `${p.y+50}px`;
  },

  exportJSON(){

    const data = {

      objects:this.objects,

      layers:this.layers
    };

    const blob = new Blob(

      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],

      {
        type:"application/json"
      }
    );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "cad-project.json";

    a.click();

    URL.revokeObjectURL(url);
  },

  importJSON(){

    const input =
      document.createElement(
        "input"
      );

    input.type = "file";

    input.accept =
      ".json";

    input.onchange = e=>{

      const file =
        e.target.files[0];

      if(!file) return;

      const reader =
        new FileReader();

      reader.onload = ev=>{

        try{

          const data =
            JSON.parse(
              ev.target.result
            );

          this.pushUndo();

          this.objects =
            data.objects || [];

          this.layers =
            data.layers || [];

          this.saveLocal();

          this.renderLayers();

          this.render();

        }catch{

          alert("Invalid file");
        }
      };

      reader.readAsText(file);
    };

    input.click();
  },

  savePNG(){

    const temp =
      document.createElement("canvas");

    temp.width =
      this.canvas.width;

    temp.height =
      this.canvas.height;

    const tctx =
      temp.getContext("2d");

    tctx.fillStyle = "#ffffff";

    tctx.fillRect(
      0,
      0,
      temp.width,
      temp.height
    );

    tctx.drawImage(
      this.canvas,
      0,
      0
    );

    const link =
      document.createElement("a");

    link.download =
      "cad-drawing.png";

    link.href =
      temp.toDataURL("image/png");

    link.click();
  }
};

window.addEventListener(
  "load",
  ()=>CAD.init()
);

</script>
