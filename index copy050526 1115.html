<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus OS</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="18" fill="%23d4d4d4"/>
  <path d="M28 55 L45 72 L72 32" stroke="%232b2b2b" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>'>
<style>
:root{
  --bg:#d4d4d4;
  --panel:#e6e6e6;
  --border:#999;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Segoe UI;
  background:var(--bg);
}

/* ===== TOPBAR ===== */
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 16px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
}

.right{
  display:flex;
  align-items:center;
  gap:10px;
}

button{
  padding:6px 10px;
  border:1px solid #888;
  background:#eee;
  cursor:pointer;
}

/* ===== DASHBOARD ===== */
.dashboard{
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  padding:30px 10px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
  filter:brightness(0.95);
}

.io-bar{
  margin-top:20px;
  display:flex;
  justify-content:center;
  gap:12px;
  padding:14px;
  border-top:1px solid var(--border);
}

.io-bar button{
  padding:8px 14px;
  border:1px solid #888;
  background:linear-gradient(#fff,#eee);
  cursor:pointer;
  transition:.15s;
}

.io-bar button:hover{
  transform:translateY(-1px);
  background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

/* ===== LOCK OVERLAY ===== */
.overlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

/* WALL behavior */
.overlay.closed{ pointer-events:auto; }
.overlay.open{ pointer-events:none; }

/* ===== METAL GATES ===== */
.gate{
  position:absolute;
  top:0;
  width:50%;
  height:100%;
  background:linear-gradient(90deg,#bbb,#999);
  z-index:10000;
  pointer-events:auto;
  transition:transform .6s ease;
}

.left{ left:0; }
.right{ right:0; }

.overlay.closed .left{ transform:translateX(0); }
.overlay.closed .right{ transform:translateX(0); }

.overlay.open .left{ transform:translateX(-100%); }
.overlay.open .right{ transform:translateX(100%); }

/* ===== MODAL ===== */
.modal{
  position:relative;
  z-index:10001;
  background:#eaeaea;
  border:1px solid #888;
  padding:20px;
  width:300px;
  text-align:center;
  opacity:0;
  transform:scale(0.9);
  transition:.3s;
}

.overlay.closed .modal{
  opacity:1;
  transform:scale(1);
  pointer-events:auto;
}

.modal h1{
  letter-spacing:3px;
  margin-bottom:10px;
}

.modal input{
  width:100%;
  padding:8px;
  margin:10px 0;
  border:1px solid #888;
}

.small{
  font-size:12px;
  opacity:0.7;
}

/* ===== LOCK EFFECT ===== */
body.locked .dashboard{
  pointer-events:none;
  user-select:none;
  filter:blur(2px);
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div>
    🧠 Focus OS
    <div id="date" class="small"></div>
  </div>

  <div class="right">
    <div id="clock"></div>
    <button id="authBtn">🔒</button>
    <button id="logoutBtn">Logout</button>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard">
  <div class="grid">
    <div class="card" onclick="go('calendar.html')">📅 Calendar</div>
    <div class="card" onclick="go('timer.html')">⏱ Timer</div>
    <div class="card" onclick="go('todo.html')">✅ Todo</div>
    <div class="card" onclick="go('notes.html')">📝 Notes</div>
    <div class="card" onclick="go('notes2.html')">🗂 Notes 2</div>
  </div>
  <div class="io-bar">
    <button onclick="exportAll()">⬇ Export Backup</button>
    <button onclick="importAll()">⬆ Restore Backup</button>
  </div>
</div>

<!-- OVERLAY -->
<div class="overlay closed" id="overlay">

  <div class="gate left"></div>
  <div class="gate right"></div>

  <div class="modal">
    <h1>EFFICIENCY</h1>

    <input id="pass" type="password" placeholder="Password">

    <button id="actionBtn"></button>

    <div class="small" id="msg"></div>
  </div>

</div>

<script>

/* =========================
   STORE (UNCHANGED LOGIC, SAFE)
========================= */
const Store = {
  key: "focusOS",

  get(){
    const data = JSON.parse(localStorage.getItem(this.key) || "{}");

    return {
      todos: data.todos || [],
      docs: data.docs || {},
      grid: data.grid || [],
      sessions: data.sessions || [],
      timer: data.timer || null,
      calendar: {
        notes: (data.calendar && data.calendar.notes) ? data.calendar.notes : {}
      }
    };
  },

  set(data){
    localStorage.setItem(this.key, JSON.stringify(data));
  },

  update(fn){
    const data = this.get();
    fn(data);
    this.set(data);
  }
};


/* =========================
   AUTH (FIXED ONLY WHERE BROKEN)
========================= */
const overlayEl = document.getElementById("overlay");
const passEl = document.getElementById("pass");
const msgEl = document.getElementById("msg");
const actionBtn = document.getElementById("actionBtn");
const authBtn = document.getElementById("authBtn");
const logoutBtn = document.getElementById("logoutBtn");

const Auth = {
  key: "focus_pass",
  session: "login_time",

  open(){
    document.body.classList.add("locked");

    if(!overlayEl) return;

    overlayEl.style.display = "flex";

    const hasPass = localStorage.getItem(this.key);

    if(actionBtn){
      if(hasPass){
        actionBtn.textContent = "Login";
        actionBtn.onclick = () => this.login();
      } else {
        actionBtn.textContent = "Create Password";
        actionBtn.onclick = () => this.register();
      }
    }
  },

  close(){
    document.body.classList.remove("locked");

    if(!overlayEl) return;

    overlayEl.style.display = "none";
  },

  register(){
    const p = passEl?.value;
    if(!p) return this.msg("Enter password");

    localStorage.setItem(this.key, p);
    this.setSession();
    this.close();
  },

  login(){
    const p = passEl?.value;
    const saved = localStorage.getItem(this.key);

    if(p === saved){
      this.setSession();
      this.close();
    } else {
      this.msg("Wrong password");
    }
  },

  logout(){
    localStorage.removeItem(this.session);
    location.reload();
  },

  setSession(){
    localStorage.setItem(this.session, Date.now());
  },

  check(){
    const t = localStorage.getItem(this.session);

    if(!t){
      this.open();
      return;
    }

    if(Date.now() - t > 10 * 60 * 60 * 1000){
      this.logout();
    } else {
      this.close();
    }
  },

  msg(t){
    if(msgEl) msgEl.textContent = t;
  }
};


/* =========================
   CLOCK (SAFE)
========================= */
function tick(){
  const d = new Date();

  const clockEl = document.getElementById("clock");
  const dateEl = document.getElementById("date");

  if(clockEl) clockEl.textContent = d.toLocaleTimeString();
  if(dateEl) dateEl.textContent = d.toDateString();
}

setInterval(tick, 1000);
tick();


/* =========================
   NAV
========================= */
function go(p){
  location.href = p;
}


/* =========================
   EVENTS (SAFE)
========================= */
if(authBtn) authBtn.onclick = () => Auth.open();
if(logoutBtn) logoutBtn.onclick = () => Auth.logout();


/* =========================
   INIT (NO TIMING CHANGE)
========================= */
Auth.check();


/* =========================
   EXPORT / IMPORT (FIXED BUT SIMPLE)
========================= */
function exportAll(){
  const data = Store.get();
  navigator.clipboard.writeText(JSON.stringify(data, null, 2));
  alert("System copied");
}

function importAll(){
  const raw = prompt("Paste system JSON");
  if(!raw) return;

  try{
    const data = JSON.parse(raw);
    Store.set(data);
    location.reload();
  } catch(e){
    alert("Invalid JSON");
  }
}

</script>

</body>
</html>
